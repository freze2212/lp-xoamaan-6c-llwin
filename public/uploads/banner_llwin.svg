<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0f1b3d"/>
      <stop offset="100%" stop-color="#050a1a"/>
    </linearGradient>

    <!-- Blue Glow Gradient for LLwin -->
    <linearGradient id="blueLogo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e60ff"/>
      <stop offset="50%" stop-color="#2b72ff"/>
      <stop offset="100%" stop-color="#1a56f0"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="400" height="200" rx="16" fill="url(#cardBg)" stroke="url(#borderGlow)" stroke-width="2.5"/>

  <!-- Subtle High-tech Grid Background -->
  <g opacity="0.08" stroke="#3b82f6" stroke-width="0.8">
    <line x1="0" y1="40" x2="400" y2="40" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="80" y1="0" x2="80" y2="200" />
    <line x1="160" y1="0" x2="160" y2="200" />
    <line x1="240" y1="0" x2="240" y2="200" />
    <line x1="320" y1="0" x2="320" y2="200" />
  </g>

  <!-- Top Left HOT Badge -->
  <g transform="translate(14, 14)">
    <rect width="64" height="22" rx="6" fill="#ef4444" />
    <text x="32" y="15" font-family="'Inter', sans-serif" font-size="11" font-weight="900" text-anchor="middle" fill="#ffffff" letter-spacing="1">🔥 HOT</text>
  </g>

  <!-- Top Right VIP Badge -->
  <g transform="translate(322, 14)">
    <rect width="64" height="22" rx="6" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1" />
    <text x="32" y="15" font-family="'Inter', sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#60a5fa" letter-spacing="0.5">OFFICIAL</text>
  </g>

  <!-- Exact LLwin Logo Centerpiece (Electric Blue, Italic, Bold) -->
  <g transform="translate(200, 108)">
    <!-- White Backing Glow for perfect contrast -->
    <text x="0" y="0" font-family="'Arial Black', 'Inter', 'Impact', sans-serif" font-size="64" font-weight="900" font-style="italic" text-anchor="middle" fill="#ffffff" opacity="0.12" transform="scale(1.02)">LLwin</text>
    
    <!-- Deep Drop Shadow -->
    <text x="3" y="4" font-family="'Arial Black', 'Inter', 'Impact', sans-serif" font-size="64" font-weight="900" font-style="italic" text-anchor="middle" fill="#000000" opacity="0.6">LLwin</text>
    
    <!-- Main Electric Blue LLwin Logo with Glow -->
    <text x="0" y="0" font-family="'Arial Black', 'Inter', 'Impact', sans-serif" font-size="64" font-weight="900" font-style="italic" text-anchor="middle" fill="url(#blueLogo)" filter="url(#logoGlow)">LLwin</text>
  </g>

  <!-- Subtitle Ribbon -->
  <g transform="translate(200, 164)">
    <rect x="-105" y="-13" width="210" height="26" rx="13" fill="#1e40af" fill-opacity="0.4" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="0" y="5" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#93c5fd" letter-spacing="1.2">NHÀ CÁI ĐẲNG CẤP VIP</text>
  </g>
</svg>
